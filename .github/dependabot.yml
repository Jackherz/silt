# Weekly pull requests for out-of-date CI actions and the browser version's packages.
# Majors (React 19, Vite 7+) come as their own pull requests to try first.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    groups:
      web-minor:
        update-types: [minor, patch]
