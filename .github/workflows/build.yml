name: build

# Runs on pull requests, on pushes to main that change code (docs-only pushes
# skip it), and from the Actions tab's "Run workflow" button. A newer push
# cancels a run still in progress for the same branch.
on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - CMakeLists.txt
      - core/**
      - plugin/**
      - tests/**
      - tools/**
      - .github/workflows/**

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # windows-2022 returns once the Windows build is fixed (its own branch).
        os: [macos-14]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      # JUCE, clap-juce-extensions and Catch2, fetched once per CMakeLists.txt change.
      - uses: actions/cache@v4
        with:
          path: .deps
          key: deps-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}

      # Compiler cache on macOS, where runner minutes cost the most.
      - name: ccache (macOS)
        if: runner.os == 'macOS'
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ccache-${{ runner.os }}
          max-size: 500M

      - name: Configure
        shell: bash
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DSILT_COPY_AFTER_BUILD=OFF \
            -DFETCHCONTENT_BASE_DIR="$GITHUB_WORKSPACE/.deps" \
            ${{ runner.os == 'macOS' && '-DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DCMAKE_OBJC_COMPILER_LAUNCHER=ccache -DCMAKE_OBJCXX_COMPILER_LAUNCHER=ccache' || '' }}

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Unit tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Fetch pluginval (macOS)
        if: runner.os == 'macOS'
        run: |
          curl -sSL -o pluginval.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_macOS.zip
          unzip -q pluginval.zip

      - name: Fetch pluginval (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Windows.zip -OutFile pluginval.zip
          Expand-Archive pluginval.zip -DestinationPath .

      - name: Validate VST3 (macOS)
        if: runner.os == 'macOS'
        run: |
          for p in "build/Silt_artefacts/Release/VST3/Silt.vst3" "build/SiltFX_artefacts/Release/VST3/Silt FX.vst3"; do
            pluginval.app/Contents/MacOS/pluginval --strictness-level 10 --skip-gui-tests --timeout-ms 120000 --validate "$p"
          done

      - name: Validate VST3 (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          foreach ($p in @("build/Silt_artefacts/Release/VST3/Silt.vst3", "build/SiltFX_artefacts/Release/VST3/Silt FX.vst3")) {
            .\pluginval.exe --strictness-level 10 --skip-gui-tests --timeout-ms 120000 --validate "$p"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - uses: actions/upload-artifact@v4
        with:
          name: silt-${{ runner.os }}
          retention-days: 7
          path: |
            build/Silt_artefacts/Release/VST3
            build/Silt_artefacts/Release/CLAP
            build/SiltFX_artefacts/Release/VST3
            build/SiltFX_artefacts/Release/CLAP
