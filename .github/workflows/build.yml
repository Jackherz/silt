name: build

# Runs on pushes to main and pull requests that change the plug-in's code (docs-only
# and web-only changes skip it), and from the Actions tab's "Run workflow" button.
# A newer push cancels a run still in progress for the same branch.
on:
  pull_request:
    paths:
      - CMakeLists.txt
      - core/**
      - plugin/**
      - tests/**
      - tools/**
      - kit
      - .gitmodules
      - .github/workflows/**
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - CMakeLists.txt
      - core/**
      - plugin/**
      - tests/**
      - tools/**
      - kit
      - .gitmodules
      - .github/workflows/**

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The token can read the repository and nothing else.
permissions:
  contents: read

jobs:
  # The JUCE-free core and its tests on Linux (libstdc++): a cheap portability check.
  core-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          submodules: recursive
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DSILT_CORE_ONLY=ON
      - name: Build
        run: cmake --build build --parallel "$(nproc)"
      - name: Unit tests
        run: ctest --test-dir build --output-on-failure

  build:
    strategy:
      fail-fast: false
      matrix:
        # windows-2022 returns once the Windows build is fixed (its own branch).
        os: [macos-15]
    runs-on: ${{ matrix.os }}
    # A clean build takes well under an hour; since 2026-11-06 the Build step has hung
    # until GitHub's 6-hour limit, so stop it long before that.
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          submodules: recursive

      # JUCE, clap-juce-extensions and Catch2, fetched once per CMakeLists.txt change.
      - uses: actions/cache@v6
        with:
          path: .deps
          key: deps-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}

      # Compiler cache on macOS, where runner minutes cost the most.
      - name: ccache (macOS)
        if: runner.os == 'macOS'
        uses: hendrikmuhs/ccache-action@e91f31892a1d1b8c44424b1a94c0b7f52d337168   # v1.2.26
        with:
          key: ccache-${{ runner.os }}
          max-size: 500M

      - name: Configure
        shell: bash
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DSILT_COPY_AFTER_BUILD=OFF \
            -DFETCHCONTENT_BASE_DIR="$GITHUB_WORKSPACE/.deps" \
            ${{ runner.os == 'macOS' && '-DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DCMAKE_OBJC_COMPILER_LAUNCHER=ccache -DCMAKE_OBJCXX_COMPILER_LAUNCHER=ccache' || '' }}

      # A job count, always: with the Makefile generator a bare --parallel is make -j with
      # no limit: up to ~180 JUCE compiles at once, the likely cause of the hangs since 2026-11-06.
      - name: Build
        timeout-minutes: 60
        shell: bash
        run: cmake --build build --config Release --parallel "$(getconf _NPROCESSORS_ONLN)"

      - name: Unit tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Fetch pluginval (macOS)
        if: runner.os == 'macOS'
        run: |
          curl -sSL -o pluginval.zip https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_macOS.zip
          unzip -q pluginval.zip

      - name: Fetch pluginval (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_Windows.zip -OutFile pluginval.zip
          Expand-Archive pluginval.zip -DestinationPath .

      - name: Validate VST3 (macOS)
        if: runner.os == 'macOS'
        run: |
          for p in "build/Silt_artefacts/Release/VST3/Silt.vst3" "build/SiltFX_artefacts/Release/VST3/Silt FX.vst3"; do
            pluginval.app/Contents/MacOS/pluginval --strictness-level 10 --skip-gui-tests --timeout-ms 120000 --validate "$p"
          done

      - name: State round trip (macOS)
        if: runner.os == 'macOS'
        run: |
          for p in "build/Silt_artefacts/Release/VST3/Silt.vst3" "build/SiltFX_artefacts/Release/VST3/Silt FX.vst3"; do
            build/silt_hostcheck_artefacts/Release/silt_hostcheck "$p"
          done

      - name: Validate VST3 (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          foreach ($p in @("build/Silt_artefacts/Release/VST3/Silt.vst3", "build/SiltFX_artefacts/Release/VST3/Silt FX.vst3")) {
            .\pluginval.exe --strictness-level 10 --skip-gui-tests --timeout-ms 120000 --validate "$p"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - uses: actions/upload-artifact@v7
        with:
          name: silt-${{ runner.os }}
          retention-days: 7
          path: |
            build/Silt_artefacts/Release/VST3
            build/Silt_artefacts/Release/CLAP
            build/SiltFX_artefacts/Release/VST3
            build/SiltFX_artefacts/Release/CLAP
